<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WhatsApp CRM</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">💬 WhatsApp CRM</div>
    <nav id="nav">
      <button data-view="inbox" class="active"><span data-i18n="nav.inbox">Inbox</span> <span id="unreadBadge" class="badge hidden"></span></button>
      <button data-view="contacts" data-i18n="nav.contacts">Contacts</button>
      <button data-view="pipeline" data-i18n="nav.pipeline">Pipeline</button>
      <button data-view="followups" data-i18n="nav.followups">Follow-ups</button>
      <button data-view="bot" data-i18n="nav.bot">Bot</button>
      <button data-view="settings" data-i18n="nav.settings">Settings</button>
    </nav>
    <select id="uiLang" class="langpick" aria-label="Dashboard language"></select>
    <div id="modeBadge" class="mode"></div>
  </header>

  <main id="view"></main>

  <dialog id="modal"><form method="dialog" id="modalForm"></form></dialog>
  <div id="toast" class="toast hidden"></div>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
